<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Códice Icons 2.0</title>

    <!-- Librería de iconos -->
    <link
        rel="stylesheet"
        href="./icons.css"
    >

    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            margin-bottom: 40px;
        }

        .demo {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .icon {
            font-size: 40px;
            color: #002D62;
        }

        .icon-orange {
            color: #F09B2E;
        }

        .icon-green {
            color: #198754;
        }

    </style>

</head>


<body>

    <h1>Códice Icons 2.0</h1>

    <div class="demo">

        <i class="ico-buscar icon"></i>

        <i class="ico-card icon"></i>

        <i class="ico-edit icon"></i>

    </div>


    <h2>Prueba de colores</h2>

    <div class="demo">

        <i class="ico-buscar icon icon-orange"></i>

        <i class="ico-card icon icon-green"></i>

        <i class="ico-edit icon icon-orange"></i>

    </div>


    <h2>Prueba de tamaños</h2>

    <div class="demo">

        <i
            class="ico-card"
            style="font-size: 16px;"
        ></i>

        <i
            class="ico-card"
            style="font-size: 32px;"
        ></i>

        <i
            class="ico-card"
            style="font-size: 64px;"
        ></i>

    </div>

</body>

</html>
