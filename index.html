<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Códice Icons 2.0</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/AlinePeralta/codiceicons@main/icons.css?v=9"
    >

</head>


<body>

    <h1>Icons 2.0 Codex</h1>
    <p class="icon-orange">Explora la colección de iconos SVG de Códice Icons 2.0.</p>

    <div class="demo">

        <i class="ico-buscar icon"></i>

        <i class="ico-card icon"></i>

        <i class="ico-edit icon"></i>

    </div>


    <h2>Prueba de colores</h2>

    <div class="demo">

        <i class="ico-buscar icon icon-orange"></i>

        <i class="ico-card icon icon-green"></i>

        <i class="ico-edit icon icon-orange"></i>

    </div>


    <h2>Prueba de tamaños</h2>

    <div class="demo">

        <i
            class="ico-card"
            style="font-size: 16px;"
        ></i>

        <i
            class="ico-card"
            style="font-size: 32px;"
        ></i>

        <i
            class="ico-card"
            style="font-size: 64px;"
        ></i>

    </div>

</body>

</html>
